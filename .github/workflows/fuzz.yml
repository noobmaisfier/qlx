name: fuzz
# Fuzzing is not part of ci.yml: 10 million executions take hours, and ci.yml
# must stay fast enough to gate a pull request. Launch it by hand
# (Actions -> fuzz -> Run workflow) before a release, or locally:
#
#   scripts/ci-local.sh fuzz --fuzztime 10000000x
on:
  workflow_dispatch:
jobs:
  fuzz:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version: "1.27.x" }
      - name: identifier and render fuzz (10M executions)
        run: |
          go test -run '^$' -fuzz FuzzQuoteIdent -fuzztime 10000000x .
          go test -run '^$' -fuzz FuzzRenderNeverPanics -fuzztime 10000000x .
      - uses: actions/upload-artifact@v4
        if: failure()
        with: { name: fuzz-corpus, path: testdata/fuzz }
